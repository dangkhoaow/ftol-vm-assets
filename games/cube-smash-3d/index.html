<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>Cube Smash 3D</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0b0b14;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  #hud{position:fixed;top:10px;left:12px;color:#fff;font-size:15px;text-shadow:0 1px 3px #000;user-select:none;}
  #hearts{position:fixed;top:10px;right:12px;color:#ff5470;font-size:20px;letter-spacing:3px;text-shadow:0 1px 3px #000;}
  #combo{position:fixed;top:36px;left:12px;color:#ffd166;font-size:13px;text-shadow:0 1px 3px #000;}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,6,14,.82);color:#fff;text-align:center;padding:18px;}
  #overlay h1{font-size:30px;margin:0 0 8px 0;letter-spacing:2px;}
  #overlay p{max-width:460px;font-size:14.5px;color:#cfcfe0;margin:6px 0;}
  #overlay button{margin-top:14px;padding:12px 34px;font-size:17px;font-weight:700;border:0;border-radius:8px;background:#7c5cff;color:#fff;cursor:pointer;}
  #overlay button:hover{background:#9678ff;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="hud">Score 0 &middot; Wave 1 &middot; 0:00</div>
<div id="combo"></div>
<div id="hearts">&#9829;&#9829;&#9829;</div>
<div id="overlay">
  <h1>CUBE SMASH 3D</h1>
  <p>Waves of cubes close in on the arena. Move with WASD / arrows (or drag on touch) and press Space / tap to DASH - the dash smashes every cube it touches. Chain smashes for combo points. Three hearts; a cube that reaches you costs one.</p>
  <p id="bestLine"></p>
  <button id="startBtn" type="button">Play</button>
</div>
<script src="../../vendor/three/three.min.js"></script>
<script>
(function(){
  'use strict';
  var LS_KEY = 'ftol:cubesmash3d:best';
  var scene, camera, renderer, player, arena;
  var cubes = [], shards = [];
  var keys = {}, touchTarget = null;
  var running = false, over = false;
  var score = 0, wave = 1, hearts = 3, combo = 0, comboTimer = 0, elapsed = 0;
  var dashCd = 0, dashActive = 0, dashRadius = 3.2, moveSpeed = 9;
  var ARENA_R = 16;
  var lastT = 0, spawnTimer = 0;

  var hud = document.getElementById('hud');
  var heartsEl = document.getElementById('hearts');
  var comboEl = document.getElementById('combo');
  var overlay = document.getElementById('overlay');
  var bestLine = document.getElementById('bestLine');

  function best(){ try { return parseInt(localStorage.getItem(LS_KEY) || '0', 10) || 0; } catch(e){ return 0; } }
  function saveBest(v){ try { if (v > best()) localStorage.setItem(LS_KEY, String(v)); } catch(e){} }
  bestLine.textContent = best() ? ('Best score on this device: ' + best()) : 'Scores stay in this browser (ftol:cubesmash3d:best).';

  function init(){
    scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0b0b14, 30, 70);
    camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 200);
    renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x8888aa, 0.9));
    var sun = new THREE.DirectionalLight(0xffffff, 0.9);
    sun.position.set(8, 18, 6);
    scene.add(sun);

    arena = new THREE.Mesh(
      new THREE.CylinderGeometry(ARENA_R, ARENA_R, 0.5, 48),
      new THREE.MeshStandardMaterial({ color:0x1c1c30, roughness:0.85 })
    );
    arena.position.y = -0.25;
    scene.add(arena);
    var rim = new THREE.Mesh(
      new THREE.TorusGeometry(ARENA_R, 0.18, 10, 64),
      new THREE.MeshStandardMaterial({ color:0x7c5cff, emissive:0x4b2fd6, emissiveIntensity:0.7 })
    );
    rim.rotation.x = Math.PI/2;
    scene.add(rim);

    player = new THREE.Group();
    var body = new THREE.Mesh(
      new THREE.SphereGeometry(0.75, 24, 18),
      new THREE.MeshStandardMaterial({ color:0x35e0c0, emissive:0x0f6d5a, emissiveIntensity:0.6, roughness:0.35 })
    );
    body.position.y = 0.75;
    player.add(body);
    player.userData.ring = new THREE.Mesh(
      new THREE.TorusGeometry(dashRadius, 0.07, 8, 40),
      new THREE.MeshBasicMaterial({ color:0xffd166, transparent:true, opacity:0 })
    );
    player.userData.ring.rotation.x = Math.PI/2;
    player.userData.ring.position.y = 0.35;
    player.add(player.userData.ring);
    scene.add(player);

    addEventListener('resize', function(){
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    addEventListener('keydown', function(e){
      keys[e.code] = true;
      if (e.code === 'Space'){ e.preventDefault(); if (over) restart(); else dash(); }
      if (e.code === 'KeyR' && over) restart();
    });
    addEventListener('keyup', function(e){ keys[e.code] = false; });
    renderer.domElement.addEventListener('pointerdown', function(e){
      if (over){ restart(); return; }
      dash();
      touchTarget = toArena(e);
    });
    renderer.domElement.addEventListener('pointermove', function(e){
      if (e.buttons) touchTarget = toArena(e);
    });
    renderer.domElement.addEventListener('pointerup', function(){ touchTarget = null; });
    requestAnimationFrame(loop);
  }

  function toArena(e){
    var v = new THREE.Vector3((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1, 0.5).unproject(camera);
    var dir = v.sub(camera.position).normalize();
    var t = -camera.position.y / dir.y;
    var p = camera.position.clone().add(dir.multiplyScalar(t));
    return new THREE.Vector2(p.x, p.z);
  }

  function spawnCube(){
    var size = 0.9 + Math.random()*0.9;
    var hue = 0.62 + Math.random()*0.25;
    var c = new THREE.Mesh(
      new THREE.BoxGeometry(size, size, size),
      new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(hue, 0.75, 0.55), roughness:0.5 })
    );
    var a = Math.random()*Math.PI*2;
    c.position.set(Math.cos(a)*(ARENA_R-0.8), size/2, Math.sin(a)*(ARENA_R-0.8));
    c.userData = { speed: (1.0 + wave*0.16 + Math.random()*0.5), size:size, spin:(Math.random()-0.5)*2 };
    scene.add(c);
    cubes.push(c);
  }

  function burst(pos, color){
    for (var i=0;i<7;i++){
      var s = new THREE.Mesh(new THREE.BoxGeometry(0.18,0.18,0.18), new THREE.MeshBasicMaterial({ color:color }));
      s.position.copy(pos);
      s.userData = { v: new THREE.Vector3((Math.random()-0.5)*8, Math.random()*7+2, (Math.random()-0.5)*8), life: 0.7 };
      scene.add(s);
      shards.push(s);
    }
  }

  function dash(){
    if (!running || dashCd > 0) return;
    dashCd = 1.1;
    dashActive = 0.22;
    player.userData.ring.material.opacity = 0.9;
    var hit = 0;
    for (var i=cubes.length-1;i>=0;i--){
      var c = cubes[i];
      if (c.position.distanceTo(player.position) <= dashRadius + c.userData.size/2){
        burst(c.position, c.material.color);
        scene.remove(c);
        cubes.splice(i,1);
        hit++;
      }
    }
    if (hit){
      combo += hit;
      comboTimer = 2.2;
      score += hit * 10 * Math.max(1, Math.floor(combo/5)+1);
      if (score > 0 && wave < 40 && score > wave*wave*60){ wave++; moveSpeed += 0.25; dashRadius = Math.min(5.2, dashRadius + 0.12); rebuildRing(); }
    }
  }

  function rebuildRing(){
    var old = player.userData.ring;
    player.remove(old);
    old.geometry.dispose();
    var ring = new THREE.Mesh(new THREE.TorusGeometry(dashRadius, 0.07, 8, 40), old.material);
    ring.rotation.x = Math.PI/2; ring.position.y = 0.35;
    player.userData.ring = ring;
    player.add(ring);
  }

  function hudText(){
    var m = Math.floor(elapsed/60), s = Math.floor(elapsed%60);
    hud.innerHTML = 'Score ' + score + ' &middot; Wave ' + wave + ' &middot; ' + m + ':' + (s<10?'0':'') + s;
    heartsEl.innerHTML = new Array(hearts+1).join('&#9829;') || '&#9760;';
    comboEl.textContent = combo >= 5 ? ('Combo x' + (Math.floor(combo/5)+1)) : '';
  }

  function loop(t){
    requestAnimationFrame(loop);
    var dt = Math.min(0.05, (t - lastT)/1000 || 0.016);
    lastT = t;
    if (running && !over){
      elapsed += dt;
      spawnTimer -= dt;
      var interval = Math.max(0.28, 1.5 - wave*0.09);
      if (spawnTimer <= 0){ spawnCube(); spawnTimer = interval; }

      var mv = new THREE.Vector2(0,0);
      if (keys.KeyW || keys.ArrowUp) mv.y -= 1;
      if (keys.KeyS || keys.ArrowDown) mv.y += 1;
      if (keys.KeyA || keys.ArrowLeft) mv.x -= 1;
      if (keys.KeyD || keys.ArrowRight) mv.x += 1;
      if (touchTarget){
        var d = new THREE.Vector2(touchTarget.x - player.position.x, touchTarget.y - player.position.z);
        if (d.length() > 0.4) mv.copy(d);
      }
      if (mv.length() > 0){
        mv.normalize().multiplyScalar(moveSpeed*dt);
        player.position.x = Math.max(-ARENA_R+1, Math.min(ARENA_R-1, player.position.x + mv.x));
        player.position.z = Math.max(-ARENA_R+1, Math.min(ARENA_R-1, player.position.z + mv.y));
      }
      if (dashCd > 0) dashCd -= dt;
      if (dashActive > 0){ dashActive -= dt; if (dashActive <= 0) player.userData.ring.material.opacity = 0; }
      if (comboTimer > 0){ comboTimer -= dt; if (comboTimer <= 0) combo = 0; }

      for (var i=cubes.length-1;i>=0;i--){
        var c = cubes[i];
        var dir = new THREE.Vector3().subVectors(player.position, c.position);
        dir.y = 0;
        var dist = dir.length();
        dir.normalize();
        c.position.addScaledVector(dir, c.userData.speed*dt);
        c.rotation.y += c.userData.spin*dt;
        if (dist < 0.8 + c.userData.size/2){
          burst(c.position, new THREE.Color(0xff5470));
          scene.remove(c); cubes.splice(i,1);
          hearts--; combo = 0;
          if (hearts <= 0) gameOver();
        }
      }
      for (var j=shards.length-1;j>=0;j--){
        var sh = shards[j];
        sh.userData.life -= dt;
        sh.userData.v.y -= 18*dt;
        sh.position.addScaledVector(sh.userData.v, dt);
        if (sh.userData.life <= 0){ scene.remove(sh); shards.splice(j,1); }
      }
      hudText();
    }
    camera.position.set(player.position.x*0.35, 21, player.position.z*0.35 + 14);
    camera.lookAt(player.position.x*0.6, 0, player.position.z*0.6);
    renderer.render(scene, camera);
  }

  function gameOver(){
    over = true;
    saveBest(score);
    overlay.querySelector('h1').textContent = 'SMASHED!';
    overlay.querySelectorAll('p')[0].textContent = 'Score ' + score + ' - wave ' + wave + ', ' + Math.floor(elapsed) + 's survived.';
    bestLine.textContent = 'Best score on this device: ' + best();
    document.getElementById('startBtn').textContent = 'Play again';
    overlay.classList.remove('hidden');
  }

  function restart(){
    for (var i=0;i<cubes.length;i++) scene.remove(cubes[i]);
    for (var j=0;j<shards.length;j++) scene.remove(shards[j]);
    cubes = []; shards = [];
    score = 0; wave = 1; hearts = 3; combo = 0; elapsed = 0;
    dashRadius = 3.2; moveSpeed = 9; dashCd = 0;
    rebuildRing();
    player.position.set(0,0,0);
    over = false; running = true;
    overlay.classList.add('hidden');
    hudText();
  }

  document.getElementById('startBtn').addEventListener('click', restart);
  init();
})();
</script>
</body>
</html>
